<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">AtlasGrid — Dossier de réponse à incident cyber</title>
  <desc id="desc">Bannière du cas fictif MIRAGE de l'exercice KASBAH.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a1720"/>
      <stop offset="0.55" stop-color="#102b31"/>
      <stop offset="1" stop-color="#0a1720"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#3fe09a"/>
      <stop offset="1" stop-color="#75f0bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="24" fill="url(#background)"/>
  <path d="M0 420C270 340 390 540 650 430C900 323 1110 440 1600 285V520H0Z" fill="#0c222a" opacity="0.76"/>
  <path d="M0 452C318 372 465 524 720 445C1004 357 1210 432 1600 338" fill="none" stroke="#1f7a62" stroke-width="2" opacity="0.56"/>
  <rect x="92" y="86" width="16" height="266" rx="8" fill="url(#accent)"/>

  <text x="142" y="124" fill="#72efb4" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="5">EXERCICE KASBAH</text>
  <text x="142" y="213" fill="#f4fbf8" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">RÉPONSE À INCIDENT</text>
  <text x="142" y="284" fill="#f4fbf8" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">CYBER — ATLASGRID</text>
  <rect x="142" y="319" width="626" height="2" fill="#72efb4" opacity="0.8"/>
  <text x="142" y="371" fill="#c6d9d1" font-family="Arial, Helvetica, sans-serif" font-size="29">Étude de cas de gestion de crise · scénario fictif MIRAGE</text>

  <g transform="translate(1150 126)" filter="url(#shadow)">
    <rect width="310" height="250" rx="18" fill="#112c34" stroke="#2a6e61" stroke-width="2"/>
    <text x="34" y="52" fill="#72efb4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">PARCOURS</text>
    <line x1="34" y1="78" x2="274" y2="78" stroke="#315e59" stroke-width="2"/>
    <text x="34" y="122" fill="#f4fbf8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">DÉTECTION</text>
    <text x="34" y="166" fill="#f4fbf8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">INVESTIGATION</text>
    <text x="34" y="210" fill="#f4fbf8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">REPRISE</text>
    <circle cx="266" cy="114" r="7" fill="#72efb4"/>
    <circle cx="266" cy="158" r="7" fill="#72efb4"/>
    <circle cx="266" cy="202" r="7" fill="#72efb4"/>
  </g>

  <text x="142" y="458" fill="#8da9a1" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2">DÉTECTION · INVESTIGATION · CONTINUITÉ D'ACTIVITÉ · GOUVERNANCE</text>
</svg>
